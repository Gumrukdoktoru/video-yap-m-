<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <title>End card</title>
  </head>
  <body>
    <template>
      <style>
@font-face {
        font-family: "Anton";
        src: url("assets/fonts/Anton.ttf") format("truetype");
        font-weight: 400;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/Montserrat-Bold.ttf") format("truetype");
        font-weight: 700;
      }
      @font-face {
        font-family: "Montserrat";
        src: url("assets/fonts/Montserrat-ExtraBold.ttf") format("truetype");
        font-weight: 800;
      }
      #root {
        --bg: #0e2a21;
        --bg-deep: #08190f;
        --cream: #f3efdf;
        --mint: #8dfbcb;
        --stamp: #1fbf63;
      }
      /* ---------- end card ---------- */
      #root {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #end-panel {
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 70% at 50% 30%, #154536 0%, var(--bg) 45%, var(--bg-deep) 100%);
        overflow: hidden;
      }
      .glow {
        position: absolute;
        left: 140px;
        top: 360px;
        width: 800px;
        height: 800px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(141, 251, 203, 0.22) 0%, rgba(141, 251, 203, 0) 65%);
      }
      .ghost {
        position: absolute;
        left: -400px;
        width: 2200px;
        font-family: "Anton", sans-serif;
        font-size: 150px;
        line-height: 1;
        white-space: nowrap;
        color: rgba(141, 251, 203, 0.06);
        letter-spacing: 0.02em;
      }
      .ghost.g1 {
        top: 150px;
      }
      .ghost.g2 {
        top: 1560px;
      }
      #end-inner {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 380px;
      }
      .pill {
        font-weight: 700;
        font-size: 34px;
        letter-spacing: 0.08em;
        color: var(--mint);
        border: 3px solid var(--mint);
        border-radius: 999px;
        padding: 16px 34px;
      }
      .headline {
        margin-top: 64px;
        display: flex;
        flex-direction: column;
        align-items: center;
        font-family: "Anton", sans-serif;
        font-size: 138px;
        line-height: 1.04;
        text-align: center;
      }
      .mask {
        overflow: hidden;
        padding: 0 10px;
      }
      .h-line {
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .h1 {
        color: var(--cream);
      }
      .h2 {
        color: var(--mint);
      }
      .h-emoji {
        height: 112px;
        width: auto;
        display: block;
      }
      .stamp-wrap {
        position: relative;
        width: 100%;
        height: 0;
      }
      .stamp {
        position: absolute;
        right: 90px;
        top: 40px;
        width: 360px;
        padding: 18px 10px 16px;
        border: 9px solid var(--stamp);
        border-radius: 22px;
        outline: 4px solid var(--stamp);
        outline-offset: 7px;
        color: var(--stamp);
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        background: rgba(8, 25, 15, 0.35);
      }
      .stamp-big {
        font-family: "Anton", sans-serif;
        font-size: 76px;
        line-height: 1;
        letter-spacing: 0.03em;
      }
      .stamp-small {
        font-weight: 800;
        font-size: 30px;
        letter-spacing: 0.22em;
      }
      .brand {
        margin-top: 270px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .brand-row {
        display: flex;
        align-items: center;
        gap: 26px;
      }
      .brand-name {
        font-family: "Anton", sans-serif;
        font-size: 200px;
        line-height: 1;
        color: var(--cream);
      }
      .badge {
        font-family: "Anton", sans-serif;
        font-size: 104px;
        line-height: 1;
        color: var(--bg-deep);
        background: var(--mint);
        border-radius: 26px;
        padding: 16px 24px 18px;
      }
      .brand-sub {
        margin-top: 44px;
        font-weight: 800;
        font-size: 54px;
        letter-spacing: 0.14em;
        color: var(--cream);
      }
          </style>
      <div id="root" data-composition-id="endcard" data-width="1080" data-height="1920">
        <div id="end-panel">
          <div class="glow" id="glow"></div>
          <div class="ghost g1" id="ghost1" data-layout-ignore>GTİP · FOB · CIF · KAMBİYO · MEVZUAT · BEYANNAME ·</div>
          <div class="ghost g2" id="ghost2" data-layout-ignore>YEŞİL HAT · ANTREPO · MENŞE · KIYMET · TARİFE ·</div>
          <div id="end-inner">
            <div class="pill" id="pill">GÜMRÜK SINAVLARINA HAZIRLIK</div>
            <div class="headline">
              <div class="mask">
                <div class="h-line h1" id="h1">
                  DUA SİZDEN,
                  <img class="h-emoji" id="pray" src="assets/img/emoji-pray-lg.png" alt="" />
                </div>
              </div>
              <div class="mask"><div class="h-line h2" id="h2">HAZIRLIK BİZDEN.</div></div>
            </div>
            <div class="stamp-wrap">
              <div class="stamp" id="stamp" data-layout-allow-overlap>
                <div class="stamp-big">YEŞİL HAT</div>
                <div class="stamp-small">ONAYLANDI</div>
              </div>
            </div>
            <div class="brand">
              <div class="brand-row">
                <div class="brand-name" id="brand-name">CAN’LI</div>
                <div class="badge" id="badge">7/24</div>
              </div>
              <div class="brand-sub" id="brand-sub">EĞİTİM MERKEZİ</div>
            </div>
          </div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });

        // Panel slides up over the classroom; ambient glow + ghost words drift
        tl.fromTo("#end-panel", { yPercent: 100 }, { yPercent: 0, duration: 0.5, ease: "power3.inOut" }, 0);
        tl.fromTo("#glow", { scale: 0.88, opacity: 0.7 }, { scale: 1.08, opacity: 1, duration: 1.6, ease: "sine.inOut", yoyo: true, repeat: 2 }, 0);
        tl.fromTo("#ghost1", { x: -120 }, { x: 60, duration: 5, ease: "none" }, 0);
        tl.fromTo("#ghost2", { x: 60 }, { x: -120, duration: 5, ease: "none" }, 0);

        // Pill + headline
        tl.fromTo("#pill", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power2.out" }, 0.35);
        tl.fromTo("#h1", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "power4.out" }, 0.5);
        tl.fromTo("#h2", { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "power4.out" }, 0.72);
        tl.fromTo("#pray", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.45, ease: "back.out(2.2)" }, 0.95);

        // Customs stamp slams down; impact at 1.53s (global 37.13s) lines up with the thud in the mix
        tl.fromTo(
          "#stamp",
          { scale: 2.4, opacity: 0, rotation: -26 },
          { scale: 1, opacity: 0.95, rotation: -12, duration: 0.18, ease: "power4.in" },
          1.35
        );
        tl.fromTo(
          "#end-inner",
          { x: 0, y: 0 },
          {
            keyframes: [
              { x: -9, y: 5, duration: 0.05 },
              { x: 8, y: -4, duration: 0.05 },
              { x: -5, y: 3, duration: 0.05 },
              { x: 3, y: -1, duration: 0.05 },
              { x: 0, y: 0, duration: 0.06 },
            ],
          },
          1.53
        );

        // Brand lockup
        tl.fromTo("#brand-name", { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, 1.9);
        tl.fromTo("#badge", { scale: 0, rotation: -30 }, { scale: 1, rotation: -4, duration: 0.5, ease: "back.out(2.2)" }, 2.15);
        tl.fromTo("#brand-sub", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.7, ease: "power2.out" }, 2.35);

        window.__timelines["endcard"] = tl;
      </script>
    </template>
  </body>
</html>
